<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { width: 200px; font-family: sans-serif; padding: 10px; }
    button { width: 100%; padding: 8px; margin-bottom: 8px; cursor: pointer; }
    #status { font-size: 0.85em; color: #555; }
  </style>
</head>
<body>
  <div>
    <button id="scan-btn">Scan History</button>
    <button id="open-selected-btn">Open Selected</button>
    <button id="export-btn">Export Snapshot</button>
  </div>

  <h4>Open Tabs</h4>
  <div id="open-tabs" style="max-height:120px;overflow:auto;border:1px solid #eee;padding:6px;margin-bottom:8px;"></div>

  <h4>Suggested to Open</h4>
  <div id="suggested-list" style="max-height:200px;overflow:auto;border:1px solid #eee;padding:6px;margin-bottom:8px;"></div>

  <div id="status"></div>
  <script src="get_tabs.js"></script>
</body>
</html>
